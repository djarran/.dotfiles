set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "xterm-256color"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -r b select-pane -t .+1 \;  resize-pane -Z

bind -n M-H previous-window
bind -n M-L next-window

set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind S command-prompt -p "New Session:" "new-session -A -s '%%'"
bind K confirm kill-session
bind W command-prompt -p "Rename Window:" "rename-window '%%'"
bind R command-prompt -p "Rename Session:" "rename-session '%%'"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-window-option -g automatic-rename on
set-option -g allow-rename on

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

set -g @tpm_plugins '           \
   tmux-plugins/tpm             \
   tmux-plugins/tmux-sensible   \
   tmux-plugins/tmux-resurrect  \
   tmux-plugins/tmux-continuum  \
'

set -g @plugin 'Nybkox/tmux-kanagawa'

bind-key "s" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"
bind-key "w" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"

set -g @kanagawa-theme 'wave'
set -g @kanagawa-ignore-window-colors true
set -g @kanagawa-battery-colors "surimi_orange dark_gray"
set -g @kanagawa-battery-label false

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override theme backgrounds to use terminal default
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g status-bg default
set -g pane-bg default
